, "done": "按实际反馈更新日期与本轮备注", "source": "合同跟踪进展 · 第2、5、7行及P/Q列公式", "kind": "extra"}, {"id": "K6", "title": "CRC协议：SMO反馈", "action": "是否CRC协议为“是”时必须填写SMO反馈日期；自CRA发出日起5个工作日内答复。", "deps": [], "done": "按实际反馈更新日期与本轮备注", "source": "合同跟踪进展 · 第2、5、7行及P/Q列公式", "kind": "extra"}, {"id": "K7", "title": "内部反馈齐备 → 发研究中心", "action": "PM、法务、财务内部审核总时限为5个工作日，并非每部门各5日。CRC还需SMO反馈。登记发研究中心日期。", "deps": [], "done": "按实际反馈更新日期与本轮备注", "source": "合同跟踪进展 · 第2、5、7行及P/Q列公式", "kind": "extra"}, {"id": "K8", "title": "中心反馈后是否需要修改？", "action": "需修改：新增一轮记录，重新发出；不需修改：确认定稿状态。", "deps": [], "done": "按实际反馈更新日期与本轮备注", "source": "合同跟踪进展 · 第2、5、7行及P/Q列公式", "kind": "extra"}, {"id": "K9", "title": "定稿后进入签署", "action": "“是否定稿”为是、签署日期为空时，当前环节及提醒进入合同签署。", "deps": [], "done": "按实际反馈更新日期与本轮备注", "source": "合同跟踪进展 · 第2、5、7行及P/Q列公式", "kind": "extra"}, {"id": "K10", "title": "签署完成与归档", "action": "填写真实签署日期，归档签署版合同/协议。", "deps": [], "done": "按实际反馈更新日期与本轮备注", "source": "合同跟踪进展 · 第2、5、7行及P/Q列公式", "kind": "extra"}, {"id": "K11", "title": "超时催办与卡点记录", "action": "按CRA发出日至当前日期计算工作日，超过5个工作日催未反馈责任方；已发中心的轮次显示本轮时效结果。原公式NETWORKDAYS未传入法定节假日清单。", "deps": [], "done": "按实际反馈更新日期与本轮备注", "source": "合同跟踪进展 · 第2、5、7行及P/Q列公式", "kind": "extra"}, {"id": "M0", "title": "维护里程碑基线", "action": "每项记录计划完成时间、状态、实际完成时间；首例入组另有调整后计划。", "deps": [], "done": "", "source": "中心进度追踪 · 第1–2行", "kind": "extra"}, {"id": "M1", "title": "CRA每周更新", "action": "建议每周例会前更新进度与特殊说明，用于进度复盘、风险识别。", "deps": [], "done": "", "source": "使用说明 · 第6、25行", "kind": "extra"}, {"id": "M2", "title": "核对状态与事实", "action": "未开始／进行中／已完成／延期／风险／不适用。完成需同步实际日期；延期和风险记录原因、应对措施及预计完成时间。", "deps": [], "done": "", "source": "使用说明 · 第10–20行", "kind": "extra"}, {"id": "M3", "title": "合同最新轮次同步", "action": "主合同与CRC协议分别追踪，结合最新轮次查看当前环节与签署状态。", "deps": [], "done": "", "source": "中心进度dashboard · 合同区域；合同跟踪进展", "kind": "extra"}, {"id": "M4", "title": "自动汇总与超期识别", "action": "汇总里程碑达成数、计划/实际、启动倒计时；计划日期已过且状态不是已完成或不适用时生成超期提醒。", "deps": [], "done": "", "source": "汇总表；Dashboard数据 · G列公式", "kind": "extra"}, {"id": "M5", "title": "例会复盘与变更闭环", "action": "讨论卡点，登记整改措施与责任跟进。计划基线调整走变更流程并留依据，实际日期如实记录；公式区域不可覆盖。", "deps": [], "done": "", "source": "使用说明 · 第18–26行", "kind": "extra"}, {"id": "Q0", "title": "核验文件与执行条件", "action": "按法规/伦理、合同/商务、人员资质、执行准备、系统账号逐项核验。", "deps": [], "done": "", "source": "启动前Readiness检查清单 · 第2–30行", "kind": "extra"}, {"id": "Q1", "title": "登记Y / N / NA及依据", "action": "Y已齐备；N未齐备；NA不适用。记录版本/日期及备注；不适用应说明依据。", "deps": [], "done": "", "source": "启动前Readiness检查清单 · D–F列；使用说明 · 第8行", "kind": "extra"}, {"id": "Q2", "title": "未齐备 → 整改后复核", "action": "N项进入补齐/整改后复核。该回路为根据清单用途整理的阅读逻辑，不是原表新增WBS依赖。", "deps": [], "done": "", "source": "基于Readiness清单整理", "kind": "extra"}, {"id": "Q3", "title": "访视后核验与放行", "action": "核对访视已完成、遗留问题关闭或评估不影响启动、其他激活限制条件；结合I5缺陷清零、I8全部前置关闭判定放行。评估不能替代WBS的关闭标准。", "deps": [], "done": "", "source": "Readiness · 第31–33行；WBS · I5、I8", "kind": "extra"}], "rules": [{"id": "T1", "title": "进度记录字段", "sections": [{"title": "里程碑记录", "text": "十项里程碑分别记录计划完成时间、状态、实际完成时间；首例入组另有“调整后计划”。特殊说明用于记录延期、风险、变更及豁免依据。WBS有48项，但核心追踪表只设十项里程碑，并非每个WBS工作项都有独立日期栏。"}, {"title": "合同记录", "text": "按中心标识、协议类型、轮次记录：CRA发出、PM/法务/财务/SMO反馈、发研究中心、是否定稿、签署日期、本轮反馈/卡点/备注。主合同与CRC协议分开追踪。"}, {"title": "核查证据", "text": "Readiness逐项记录Y/N/NA、版本/日期及备注。此HTML仅展示字段与规则，不载入实际中心记录。"}], "source": "中心进度追踪 · 第1–2行；合同跟踪进展 · 第7行；Readiness · 第1行"}, {"id": "T2", "title": "六种状态的完整定义", "sections": [{"title": "未开始 / 进行中", "text": "未开始：里程碑尚未启动。进行中：已启动，尚在推进。"}, {"title": "已完成", "text": "已达到该里程碑完成判定标准；同步填写实际完成时间。不能仅因有日期就假定工作完成。"}, {"title": "延期", "text": "已超过计划完成时间仍未完成；在特殊说明中记录原因、整改措施及更新后的预计完成时间。"}, {"title": "风险", "text": "存在无法按期完成的风险；在特殊说明中记录风险点和应对措施。尚未超期也可以是风险。"}, {"title": "不适用", "text": "中心豁免或不适用该里程碑，例如豁免立项申报；在特殊说明中保留豁免依据。它不等于已完成。"}], "source": "使用说明 · 第10–16、20行"}, {"id": "T3", "title": "填写纪律与变更留痕", "sections": [{"title": "填写与更新", "text": "核心追踪表状态通过下拉菜单选择，不手动输入自由文本。CRA维护状态、日期、特殊说明，建议每周例会前更新。WBS按工作项、前置依赖与完成标准核验，不跳项执行。"}, {"title": "计划基线", "text": "确认后的计划完成时间不得随意修改；调整应走项目变更流程、留存依据，并在特殊说明记录变更理由。更新预计日期不应抹掉原基线。"}, {"title": "实际日期", "text": "实际完成时间是客观事实；完成后如实填写，不得随意修改。"}, {"title": "公式保护", "text": "汇总表、达成数、倒计时为公式区域，不应覆盖。原始进度在核心追踪表维护，合同联动字段结合合同跟踪表维护；公式异常应反馈处理。"}], "source": "使用说明 · 第6–9、18–26行"}, {"id": "T4", "title": "启动偏差与倒计时", "sections": [{"title": "输入来源", "text": "汇总表预计启动取中心进度追踪AC列（SIV计划），实际启动取AE列（SIV实际）；H43由使用者输入当前日期。不是直接采用首例入组的调整后计划。"}, {"title": "倒计时：原表公式", "text": "距启动倒计时＝预计启动日期－H43当前日期。正数为剩余天数，负数为已超计划日期；H43或预计启动为空时返回空白。原公式不以“已完成”状态作为停止倒计时的条件。"}, {"title": "偏差：表内说明", "text": "汇总表标题说明“天数为正＝较预计延后”。业务阅读上，实际启动晚于计划代表延后。"}, {"title": "偏差：当前公式行为", "text": "原D列使用IFERROR(DATEDIF(预计启动,实际启动,\"D\"),\"\")。日期有效且实际不早于计划时返回相差天数；实际提前时DATEDIF报错并被转为空白，不会输出负数。空日期和异常日期需先核验，不能把结果空白或0直接解释为无偏差。此处说明现有公式，不修改Excel。"}], "source": "汇总表 · A43、H43、B45:E66；使用说明 · 第23行"}, {"id": "T5", "title": "看板统计与完成率", "sections": [{"title": "状态归类", "text": "已完成按状态“已完成”计数；看板“进行中/风险”合并统计进行中、延期、风险；未开始、不适用各自统计。"}, {"title": "完成率分母", "text": "阶段完成率＝该里程碑已完成中心数÷核心追踪表中心编号的非空计数（看板A5）。原公式未从分母剔除“不适用”。除法异常时返回0。此处只描述计算口径，不展示实际中心数量。"}, {"title": "里程碑达成数", "text": "逐项统计核心追踪表十个状态栏中“已完成”的数量；“不适用”不计为已完成。"}, {"title": "超期提醒", "text": "Dashboard数据按计划日期有效、已过今天、状态不是已完成且不是不适用计算TODAY－计划日期，否则为0。它由日期与状态共同判断，不要求人工状态先改成“延期”。"}, {"title": "趋势与汇总", "text": "Chart Data按日期累计核心追踪表对应的计划/实际日期；曲线表示截至该日的累计日期记录，不等同于另行核验的状态计数。汇总表与看板是派生展示，不能替代原始记录。"}], "source": "中心进度dashboard · A5、B26:F34；中心进度追踪 · AK列；Dashboard数据 · G列；Chart Data"}, {"id": "T6", "title": "合同最新轮次与分类口径", "sections": [{"title": "主合同 / CRC分组", "text": "以中心标识＋是否CRC协议分组；F列为“是”时计为CRC，其余归主合同。需要修改再提交时新增轮次记录，保留历史。"}, {"title": "最新轮次：公式实现", "text": "看板使用XMATCH反向查找符合分组条件的最后一行，并非取E列轮次的数学最大值。新增轮次应按表内顺序追加；已签署统计还筛选CRA发出栏非空的记录。不同联动字段的筛选条件并不完全相同。"}, {"title": "已提交 / 审核中", "text": "已提交：最新记录CRA发出日期为数值日期且尚未签署。审核中：已提交、内部反馈尚未齐备、未发中心且未签署。"}, {"title": "审核完成 / 已发中心", "text": "审核完成：CRA已发出，PM、法务、财务均有数值日期，未发中心、未签署；CRC还要求SMO日期。已发中心：发中心日期为数值日期、尚未签署。"}, {"title": "已签署与定稿", "text": "已签署按签署栏数值日期判断；定稿为“是”且未填签署日期仍处合同签署环节。已提交包含部分其他未签署分类，各指标不是可直接相加的互斥分组。"}, {"title": "核心追踪表联动差异", "text": "核心表合同状态取主合同中最后一条已发出/已定稿/已签署的有效记录；实际签署日期取该中心主合同的最大数值签署日期。二者不是同一个简单“取最后行”的公式。"}], "source": "合同跟踪进展 · 第5行；中心进度dashboard · H26:J30及对应CRC列；中心进度追踪 · R/S列"}, {"id": "T7", "title": "合同工作日与催办", "sections": [{"title": "内部审核时限", "text": "PM、法务、财务合计5个工作日，自CRA发出日起计；不是每个部门各5日。CRC协议的SMO也需从同一CRA发出日起5个工作日内答复。"}, {"title": "全流程工作日", "text": "O列＝MAX(0,NETWORKDAYS(CRA发出日期,签署日期或TODAY())－1)。有数值签署日期则截止签署日，否则算到今天；CRA发出不是数值日期则为空白。减1为原公式口径。"}, {"title": "催办与签署优先级", "text": "有签署日期则显示完成；否则定稿为是先进入合同签署；已发中心则显示本轮完成及是否超时；尚未发出则待CRA发出；已发出后按PM及其他未反馈方继续跟进，超过5个工作日触发立即催办。"}, {"title": "本轮时效与日历边界", "text": "已发中心的本轮主要按CRA发出至发中心日期判定是否超过5个工作日，CRC还检查SMO是否超时。NETWORKDAYS默认排除周末，原公式未传入法定节假日和调休工作日清单，不能直接视为中国法定工作日历。"}], "source": "合同跟踪进展 · 第5行、O/P/Q列公式"}, {"id": "T8", "title": "记录 → 计算 → 输出", "sections": [{"title": "输入端", "text": "CRA维护核心里程碑和例外说明；合同表维护各轮日期及反馈；核查表维护齐备状态和证据；汇总表H43维护当前日期。"}, {"title": "派生计算", "text": "核心进度与合同记录 → 合同状态/签署日期联动、里程碑达成数、最新轮次分类、超期天数、启动偏差/倒计时及日期累计曲线。"}, {"title": "输出与复盘", "text": "汇总表和Dashboard供例会查看进度、计划/实际、逾期与卡点；需要更正时回到对应原始记录核验，不直接覆盖计算结果。"}, {"title": "此HTML的能力", "text": "本页为离线流程及规则阅读，不提供实际数据录入、保存、自动计算或与Excel同步。节点中的字段是应记录内容的说明。"}], "source": "使用说明；汇总表；中心进度dashboard；中心进度追踪；合同跟踪进展；Dashboard数据；Chart Data"}, {"id": "T9", "title": "责任CRA与中心标识映射", "sections": [{"title": "配置关系", "text": "隐藏表合同配置以中心编号为键，维护中心名称和责任CRA。合同跟踪表部分行根据编号查找名称与CRA，用于分工及汇总。此HTML只展示映射机制，不展示实例。"}, {"title": "责任与使用", "text": "CRA维护自己负责的中心进度、日期及特殊说明；看板按CRA查看负责范围、主合同/CRC提交和签署情况。编号应对应有效配置，查找不到时相关字段可能为空白，应核验配置。"}, {"title": "不生成额外审批", "text": "原表映射为数据配置，不表示新增的审批、分派或人员变更流程。本图不补造相关职责。"}], "source": "隐藏表合同配置 · A:C列；合同跟踪进展 · B/C列；中心进度dashboard · K26:P30；使用说明 · 第25行"}]}</script><script>
const DATA=JSON.parse(document.getElementById('source-data').textContent),$=id=>document.getElementById(id),all=[...DATA.nodes,...DATA.extra],byId=new Map(all.map(n=>[n.id,n]));let current='overview',view={x:0,y:0,s:1},size={w:1500,h:1000},drag=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stageNotes={A:'核心文件定稿后，开展中心筛选与通用文件包准备。',B:'材料收集 → 申请递交 → 审评补件 → 获取机构批件。',C:'材料准备后，伦理递交与费用支付分别推进；审评结束后核对批准版本。',D:'预算与条款达成一致后签署；CRC协议与首付款分别跟进。',E:'从备案材料、系统提交到获批，再开展分中心及省局登记。适用性结合实际要求核验。',F:'机构批件支持培训、药物申请与物资准备；样本冷链依赖伦理批件。',G:'先开通EDC账号，再测试、设置随机系统和培训；正常值依赖伦理批件。',H:'机构批件后开展医学、安全性、药品物资培训与资质核验；资质核验后做启动前质控。',I:'日程确认有四项显式前置；会务、试讲与授权准备分支推进，现场核查后整改与放行。',J:'启动放行后，确认首批筛选计划并完成首例知情、筛选与入组。'};
const navItems=[['overview','◎','流程总览'],...DATA.stages.map(s=>[s.id,s.id,s.title]),['contract','↻','合同多轮审核'],['readiness','✓','Readiness 核查'],['management','◷','进度与风险闭环'],['rules','▤','九项细则索引'],['sources','≡','工作表来源与口径']];
$('nav').innerHTML=navItems.map(([id,c,t])=>`<button data-page="${id}"><span class="code">${c}</span><span class="label">${esc(t)}</span></button>`).join('');
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)render(b.dataset.page);b=e.target.closest('[data-node]');if(b)detail(b.dataset.node);b=e.target.closest('[data-rule]');if(b)showRule(b.dataset.rule);if(e.target.closest('[data-close]'))$('drawer').hidden=true});

if(n.kind==='wbs'){h+='<h3>原表前置依赖</h3>'+(n.deps.length?n.deps.map(d=>`<button class="dep" data-node="${d}">${esc(d+' · '+byId.get(d).title)}</button>`).join(''):'<p>原表未列前置依赖。</p>')+`<h3>完成判定标准</h3><p>${esc(n.done)}</p>`;let next=DATA.nodes.filter(m=>m.deps.includes(n.id));h+='<h3>后续直接依赖此项</h3>'+(next.length?next.map(d=>`<button class="dep" data-node="${d.id}">${esc(d.id+' · '+d.title)}</button>`).join(''):'<p>原表未列后续直接依赖。</p>');h+=`<h3>所属阶段</h3><button data-page="${n.stage}">进入 ${n.stage} 阶段子流程 →</button>`}else if(n.done)h+=`<h3>记录与核对</h3><p>${esc(n.done)}</p>`;h+=`<h3>来源依据</h3><p class="source">${esc(n.source)}</p>`;
} if(n){const ids=nodeRules(n);if(ids.length)h+='<h3>相关执行细则</h3><p class="rule-note">展开查看字段、判定与计算口径。</p>'+ids.map(i=>ruleButton(i)).join('')} $('drawer').innerHTML=h;$('drawer').hidden=false;$('drawer').scrollTop=0;}
function ruleButton(id){const r=DATA.rules.find(r=>r.id===id);return `<button class="rule-link" data-rule="${id}">${esc(r.title)} <span>查看 →</span></button>`}
function pageRules(id){if(id==='overview')return ['T1','T2','T8'];if(DATA.stages.some(s=>s.id===id))return id==='D'?['T1','T3','T6','T7']:['T1','T2','T3'];if(id==='contract')return ['T1','T6','T7'];if(id==='management')return ['T2','T3','T4','T5','T8','T9'];if(id==='readiness')return ['T1','T3','T8'];return []}
function nodeRules(n){if(n.kind==='wbs')return n.stage==='D'?['T1','T3','T6','T7']:['T1','T2','T3'];if(n.id.startsWith('K'))return ['T1','T6','T7'];const maps={M0:['T1','T3','T4'],M1:['T1','T3','T9'],M2:['T2','T3'],M3:['T6','T7','T9'],M4:['T4','T5','T8'],M5:['T2','T3','T8'],Q0:['T1','T3'],Q1:['T1','T3'],Q2:['T2','T3'],Q3:['T1','T3']};return maps[n.id]||[]}
function showRule(id){const r=DATA.rules.find(r=>r.id===id);if(!r)return;$('drawer').innerHTML=`<button class="close" data-close aria-label="关闭详情">✕</button><div class="eyebrow">TRACKER / 规则 ${id.slice(1)}</div><h2>${esc(r.title)}</h2>${r.sections.map((s,i)=>`<details class="rule-section" open><summary>${esc(s.title)}</summary><p>${esc(s.text)}</p></details>`).join('')}<h3>Excel来源依据</h3><p class="source">${esc(r.source)}</p><h3>相关流程</h3><button data-page="${['T6','T7'].includes(id)?'contract':'management'}">进入${['T6','T7'].includes(id)?'合同审核':'进度管理'}流程 →</button> <button data-page="rules">九项细则索引</button>`;$('drawer').hidden=false;$('drawer').scrollTop=0;}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('dataExport').onclick=()=>download('中心启动-流程数据.json',JSON.stringify(DATA,null,2),'application/json');
$('export').onclick=()=>{if(!$('map'))return;let svg=$('map').cloneNode(true);svg.setAttribute('width',size.w);svg.setAttribute('height',size.h);svg.setAttribute('viewBox',`0 0 ${size.w} ${size.h}`);svg.querySelector('#world').removeAttribute('transform');const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent=document.querySelector('style').textContent;svg.insertBefore(style,svg.firstChild);svg.setAttribute('style',[...['paper','ink','muted','line','teal','bg','soft','amber']].map(k=>`--${k}:${getComputedStyle(document.body).getPropertyValue('--'+k)}`).join(';'));download('中心启动-'+current+'.svg',new XMLSerializer().serializeToString(svg),'image/svg+xml')};window.addEventListener('resize',fit);render('overview');
</script></body></html>
